# ---------------------------------------------------------------------------
# Profil dev : compte ADMIN de demonstration + jeu de donnees de test.
# Le mot de passe de demonstration DOIT etre change avant tout usage reel.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Le jeu de demonstration porte un numero eleve (V900) pour rester le dernier
# applique ; sans out-of-order, une nouvelle migration de schema serait refusee
# sur une base de developpement existante.
spring.flyway.out-of-order=true
spring.flyway.placeholders.bootstrapAdminMatricule=${APP_BOOTSTRAP_ADMIN_MATRICULE:ADM001}
# BCrypt de "Admin@2026" - demonstration, profil dev uniquement.
spring.flyway.placeholders.bootstrapAdminPasswordHash=${APP_BOOTSTRAP_ADMIN_PASSWORD_HASH:$2a$10$g/Y0t06W7Lai8PykYayF4.9fu1Plrg6eebKBKQzgIniG1SQ4JcMJS}
spring.flyway.placeholders.bootstrapAdminEmail=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@orabank.tg}

# Secret de developpement uniquement. En production : APP_JWT_SECRET obligatoire.
app.jwt-secret=${APP_JWT_SECRET:ZGV2LW9yYXZpc2l0LXNlY3JldC1rZXktcG91ci1sZS1kZXZlbG9wcGVtZW50LXVuaXF1ZW1lbnQ=}

logging.level.com.orabank.backend=DEBUG
