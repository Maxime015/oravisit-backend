# ---------------------------------------------------------------------------
# OraVisit - configuration commune.
# Toute valeur sensible vient d'une variable d'environnement (voir .env.example).
# ---------------------------------------------------------------------------
spring.application.name=oravisit-backend

# Permet de choisir le profil depuis le fichier .env ; vide = profil par defaut.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
spring.profiles.default=dev

# Spring Boot ne lit pas les .env nativement : sans cet import, seules les
# variables reellement exportees seraient prises en compte.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- Base de donnees -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oravisit}
spring.datasource.username=${DB_USERNAME:oravisit}
spring.datasource.password=${DB_PASSWORD:oravisit}
spring.datasource.hikari.pool-name=oravisit-pool
spring.datasource.hikari.maximum-pool-size=10

# Le schema appartient a Flyway : Hibernate se contente de le verifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Migrations ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.bootstrapAdminMatricule=${APP_BOOTSTRAP_ADMIN_MATRICULE:}
spring.flyway.placeholders.bootstrapAdminPasswordHash=${APP_BOOTSTRAP_ADMIN_PASSWORD_HASH:}
spring.flyway.placeholders.bootstrapAdminEmail=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@orabank.tg}
spring.flyway.placeholders.bootstrapAdminFirstName=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Administrateur}
spring.flyway.placeholders.bootstrapAdminLastName=${APP_BOOTSTRAP_ADMIN_LAST_NAME:OraVisit}
spring.flyway.placeholders.bootstrapAdminDirection=${APP_BOOTSTRAP_ADMIN_DIRECTION:DIRECTION_SYSTEMES_INFORMATION}

# --- JSON ------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
# Le frontend ne peut pas glisser un champ non prevu par le DTO d'entree.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

# --- Serveur ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# --- Application -----------------------------------------------------------
app.timezone=${APP_TIMEZONE:Africa/Lome}
# Secret HS256 encode en Base64 (32 octets minimum). Jamais commite.
app.jwt-secret=${APP_JWT_SECRET:}
app.jwt-expiration=${APP_JWT_EXPIRATION:PT8H}
app.jwt-issuer=${APP_JWT_ISSUER:oravisit}
app.cors-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Journalisation --------------------------------------------------------
logging.level.root=INFO
logging.level.com.orabank.backend=${APP_LOG_LEVEL:INFO}
